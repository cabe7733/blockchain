name: blockchain_experiences
description: Registro y consulta de experiencias aprendidas en implementaciones de blockchain en empresas.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Firebase (versiones compatibles con Flutter 3.22+) ────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2

  # ── Utilidades ────────────────────────────────────────────
  fl_chart: ^0.71.0
  file_picker: ^8.1.2
  intl: ^0.20.2
  url_launcher: ^6.3.0
  shimmer: ^3.0.0
  uuid: ^4.5.1
  provider: ^6.1.2
  pdf: ^3.11.1
  printing: ^5.13.1
  cupertino_icons: ^1.0.8
  google_generative_ai: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true